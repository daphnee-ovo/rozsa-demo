<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rózsa Sidebar</title>
<style>
:root {
  --surface: oklch(100% 0 0); --fg: oklch(20% 0.012 350);
  --muted: oklch(55% 0.01 350); --border: oklch(90% 0.006 350);
  --accent: oklch(60% 0.07 355); --success: oklch(48% 0.10 155);
  --error: oklch(52% 0.14 25); --warning: oklch(70% 0.12 85);
  --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { color: var(--fg); background: transparent; font: 13px var(--font-ui); -webkit-font-smoothing: antialiased; }
[data-sidebar-scene] { height: 100%; min-width: 0; }
[data-sidebar-scene][hidden] { display: none !important; }
.sidebar-scene { display: flex; flex-direction: column; padding-top: 24px; }
.sidebar-section { display: flex; flex-direction: column; min-height: 0; }
.sidebar-section.sessions { flex: 1; }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 6px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
button { font: inherit; }
.icon-button { border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; font-size: 17px; }
.icon-button:hover { background: var(--border); color: var(--fg); }
.sidebar-scroll { flex: 1; min-height: 0; padding: 0 6px 8px; overflow-y: auto; }
.sidebar-section.sessions { min-height: var(--dev-flow-sessions-min, 96px); }
.session-item { min-height: 34px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid transparent; border-radius: 10px; cursor: pointer; }
.session-item:hover { background: color-mix(in srgb, var(--surface) 45%, transparent); }
.session-item.active { border-color: color-mix(in oklch, var(--accent) 26%, var(--border)); background: var(--surface); }
.session-status { width: 7px; height: 7px; flex: none; border-radius: 50%; }
.session-status.running { background: var(--accent); }
.session-status.approval { background: var(--warning); }
.session-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 500; }
.session-meta { color: var(--muted); font: 10.5px var(--font-mono); }
.status-panel { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; }
.dev-flow-group { display: flex; flex-direction: column; gap: 3px; }
.dev-flow-group[hidden] { display: none; }
.dev-flow-summary { border: 0; border-radius: 7px; background: transparent; padding: 3px 6px; margin: 0 -6px; color: var(--fg); font-size: 11.5px; font-weight: 600; cursor: pointer; text-align: left; }
.dev-flow-summary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.dev-flow-summary:disabled { color: var(--muted); cursor: default; }
.dev-flow-summary.stale { color: var(--muted); }
.dev-flow-claimed { display: flex; flex-direction: column; gap: 1px; }
.dev-flow-claimed-row { min-width: 0; display: flex; align-items: center; gap: 7px; border: 0; border-radius: 7px; background: transparent; padding: 3px 6px; margin: 0 -6px; color: var(--fg); font-size: 12px; cursor: pointer; text-align: left; }
.dev-flow-claimed-row:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.dev-flow-claimed-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--accent); }
.dev-flow-claimed-id { flex: none; color: var(--accent); font: 10.5px var(--font-mono); }
.dev-flow-claimed-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev-flow-more { border: 0; border-radius: 7px; background: transparent; padding: 3px 6px; margin: 0 -6px; color: var(--muted); font: 11px var(--font-ui); cursor: pointer; text-align: left; }
.dev-flow-more:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--fg); }
.dev-flow-more[hidden] { display: none; }
.git-branch { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11.5px var(--font-mono); }
.git-stats { display: flex; gap: 5px; font: 10.5px var(--font-mono); }
.git-add { color: var(--success); } .git-del { color: var(--error); } .git-files { color: var(--muted); }
.quota-group { display: flex; flex-direction: column; gap: 8px; }
.quota-row { display: flex; flex-direction: column; gap: 4px; }
.quota-row[hidden], .quota-group[hidden] { display: none; }
.quota-label { display: flex; justify-content: space-between; color: var(--muted); font: 10.5px var(--font-mono); }
.quota-bar-track { height: 4px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--border) 72%, transparent); }
.quota-bar-fill { height: 100%; border-radius: inherit; background: var(--accent); transition: width .18s ease; }
.quota-bar-fill.warn { background: var(--warning); }
.sidebar-bottom { padding: 8px 6px; }
.sidebar-action, .settings-back, .settings-tab { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; }
.sidebar-action:hover, .settings-back:hover, .settings-tab:hover, .settings-tab.active { background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--fg); }
.settings-scene { padding: 54px 14px 20px; }
.settings-back { margin-bottom: 18px; }
.settings-tab { min-height: 36px; padding-inline: 12px; }
.settings-tab.active { font-weight: 600; }
.empty, .error { padding: 10px; color: var(--muted); font-size: 11px; }
.error { color: var(--error); }
body.native-fullscreen .sidebar-scene { padding-top: 0; }
</style>
</head>
<body>
<section id="mainSidebarScene" class="sidebar-scene" data-sidebar-scene="main-sidebar">
  <div class="sidebar-section sessions">
    <div class="sidebar-header"><span>Sessions</span><button class="icon-button" type="button" title="New session" onclick="newSidebarSession()">+</button></div>
    <div class="sidebar-scroll" id="sidebarSessionList"></div>
  </div>
  <div class="sidebar-section" id="sidebarStatusSection">
    <div class="sidebar-header"><span>Status</span></div>
    <div class="status-panel">
      <div class="git-branch" id="sidebarGitBranch">—</div>
      <div class="git-stats"><span class="git-add" id="sidebarGitAdd">—</span><span class="git-del" id="sidebarGitDel">—</span><span class="git-files" id="sidebarGitFiles">—</span></div>
      <div class="dev-flow-group" id="sidebarDevFlowGroup" hidden>
        <button class="dev-flow-summary" id="sidebarDevFlowSummary" type="button" title="Show dev-flow work details"></button>
        <div class="dev-flow-claimed" id="sidebarDevFlowClaimed"></div>
        <button class="dev-flow-more" id="sidebarDevFlowMore" type="button" hidden></button>
      </div>
      <div class="quota-group" id="sidebarQuotaGroup" hidden>
        <div class="quota-row" id="sidebarQuotaHourRow"><div class="quota-label"><span>5 hours</span><span id="sidebarQuotaHour">—</span></div><div class="quota-bar-track"><div class="quota-bar-fill" id="sidebarQuotaHourBar"></div></div></div>
        <div class="quota-row" id="sidebarQuotaWeekRow"><div class="quota-label"><span>This week</span><span id="sidebarQuotaWeek">—</span></div><div class="quota-bar-track"><div class="quota-bar-fill" id="sidebarQuotaWeekBar"></div></div></div>
      </div>
    </div>
  </div>
  <div class="sidebar-bottom">
    <button class="sidebar-action" id="sidebarDevFlowDashboard" type="button" onclick="openDevFlowDashboard()" disabled>Dashboard</button>
    <button class="sidebar-action" type="button" onclick="openSidebarSettings()">Settings</button>
  </div>
</section>
<nav id="settingsSidebarScene" class="sidebar-scene settings-scene" data-sidebar-scene="settings-sidebar" aria-label="Settings navigation" hidden inert>
  <button class="settings-back" type="button" onclick="closeSidebarSettings()">← Back to app</button>
  <button class="settings-tab active" data-settings-pane="skills" type="button" onclick="selectSidebarSettingsPane('skills')">Skills</button>
  <button class="settings-tab" data-settings-pane="tools" type="button" onclick="selectSidebarSettingsPane('tools')">Tools</button>
  <button class="settings-tab" data-settings-pane="extensions" type="button" onclick="selectSidebarSettingsPane('extensions')">Extensions</button>
  <button class="settings-tab" data-settings-pane="general" type="button" onclick="selectSidebarSettingsPane('general')">General</button>
  <button class="settings-tab" data-settings-pane="appearance" type="button" onclick="selectSidebarSettingsPane('appearance')">Appearance</button>
  <button class="settings-tab" data-settings-pane="keyboard-shortcuts" type="button" onclick="selectSidebarSettingsPane('keyboard-shortcuts')">Keyboard shortcuts</button>
  <button class="settings-tab" data-settings-pane="permissions" type="button" onclick="selectSidebarSettingsPane('permissions')">Permissions</button>
  <button class="settings-tab" data-settings-pane="dev-flow" type="button" onclick="selectSidebarSettingsPane('dev-flow')">Dev Flow</button>
</nav>
<script src="gui_shared.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
