<!DOCTYPE html>
<html lang="en" data-native-webview="sidebar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rózsa Sidebar</title>
<link rel="stylesheet" href="styles/sidebar.css">
</head>
<body>
<section id="mainSidebarScene" class="sidebar-scene" data-sidebar-scene="main-sidebar">
  <div class="sidebar-section sessions">
    <div class="sidebar-header"><span>Sessions</span><button class="icon-button" type="button" title="New session" onclick="newSidebarSession()">+</button></div>
    <div class="sidebar-scroll" id="sidebarSessionList"></div>
  </div>
  <div class="sidebar-section" id="sidebarStatusSection">
    <div class="sidebar-header"><span>Status</span></div>
    <div class="status-panel">
      <div class="git-branch" id="sidebarGitBranch">—</div>
      <div class="git-stats"><span class="git-add" id="sidebarGitAdd">—</span><span class="git-del" id="sidebarGitDel">—</span><span class="git-files" id="sidebarGitFiles">—</span></div>
      <div class="dev-flow-group" id="sidebarDevFlowGroup" hidden>
        <button class="dev-flow-summary" id="sidebarDevFlowSummary" type="button" title="Show dev-flow work details"></button>
        <div class="dev-flow-claimed" id="sidebarDevFlowClaimed"></div>
        <button class="dev-flow-more" id="sidebarDevFlowMore" type="button" hidden></button>
      </div>
      <div class="quota-group" id="sidebarQuotaGroup" hidden>
        <div class="quota-row" id="sidebarQuotaHourRow"><div class="quota-label"><span>5 hours</span><span id="sidebarQuotaHour">—</span></div><div class="quota-bar-track"><div class="quota-bar-fill" id="sidebarQuotaHourBar"></div></div></div>
        <div class="quota-row" id="sidebarQuotaWeekRow"><div class="quota-label"><span>This week</span><span id="sidebarQuotaWeek">—</span></div><div class="quota-bar-track"><div class="quota-bar-fill" id="sidebarQuotaWeekBar"></div></div></div>
      </div>
    </div>
  </div>
  <div class="sidebar-bottom">
    <button class="sidebar-action" id="sidebarDevFlowDashboard" type="button" onclick="openDevFlowDashboard()" disabled hidden>Dashboard</button>
    <button class="sidebar-action" type="button" onclick="openSidebarSettings()">Settings</button>
  </div>
</section>
<nav id="settingsSidebarScene" class="sidebar-scene settings-scene" data-sidebar-scene="settings-sidebar" aria-label="Settings navigation" hidden inert>
</nav>
<div data-template-mount="notification"></div>
<script src="gui_shared.js"></script>
<script type="module" src="runtime/entries/sidebar.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
