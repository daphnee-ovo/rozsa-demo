[package]
name = "rozsa-gui"
version.workspace = true
edition.workspace = true

[lib]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
async-trait = { workspace = true }
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rozsa-app = { path = "../rozsa-app" }
rozsa-core = { path = "../rozsa-core" }
rozsa-model = { path = "../rozsa-model" }
tracing = { workspace = true }
dashmap = { workspace = true }
base64 = { workspace = true }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.0", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSBox", "NSButton", "NSButtonCell", "NSColor", "NSGraphics", "NSImage", "NSLayoutAnchor", "NSLayoutConstraint", "NSOpenPanel", "NSPanel", "NSResponder", "NSEvent", "NSSplitView", "NSSplitViewController", "NSSplitViewItem", "NSView", "NSViewController", "NSVisualEffectView", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSNotification", "NSString", "NSUserDefaults", "NSURL"] }

[dev-dependencies]
tempfile = "3"
tauri = { workspace = true, features = ["test"] }
