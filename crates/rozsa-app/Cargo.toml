[package]
name = "rozsa-app"
version = "0.1.0"
edition = "2024"
description = "Application runtime — session, tools, permissions, extensions"
license = "MIT"

[dependencies]
rozsa-model = { path = "../rozsa-model" }
rozsa-core = { path = "../rozsa-core" }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "unit_app_model_registry"
path = "../../tests/unit/app/model_registry.rs"

[[test]]
name = "unit_app_slash_commands"
path = "../../tests/unit/app/slash_commands.rs"

[[test]]
name = "integration_app_session"
path = "../../tests/integration/app_session.rs"
