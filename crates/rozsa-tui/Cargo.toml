[package]
name = "rozsa-tui"
version = "0.1.0"
edition = "2024"

[lib]
name = "rozsa_tui"
path = "src/lib.rs"

[[bin]]
name = "rozsa-tui"
path = "src/main.rs"

[dependencies]
rozsa-app = { path = "../rozsa-app" }
rozsa-core = { path = "../rozsa-core" }
rozsa-model = { path = "../rozsa-model" }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
base64 = "0.22"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-stream = "0.1"
futures-core = "0.3"
async-trait = "0.1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-default-onig"] }
regex = "1"
chrono = "0.4"
dirs = "6"
lru = "0.18"
tracing = "0.1"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16.2"
