[workspace]
resolver = "3"
members = [
    "crates/rozsa-model",
    "crates/rozsa-core",
    "crates/rozsa-app",
    "crates/rozsa-gui",
    "crates/rozsa-cli",
]

[workspace.package]
version = "1.0.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1"
aws-smithy-types = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
dashmap = "6"
once_cell = "1.20"
tauri = { version = "=2.11.5", features = ["devtools", "unstable"] }
tauri-build = "2"

[profile.release]
incremental = true
