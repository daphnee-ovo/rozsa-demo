<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="rozsa-template-root" content="../desktop/renderer/templates/">
<title>Rózsa — Coding Agent</title>
</head>
<body data-rozsa-entry="application-shell" data-rozsa-flow-entry="scenario-flow">
<div data-application-shell>
  <div data-od-id="app-body">
    <div data-template-mount="sidebar"></div>
    <div data-template-mount="conversation"></div>
  </div>
  <div data-template-mount="popover"></div>
  <div data-template-mount="settings"></div>
  <div id="nativeGuiInteractionLayer" aria-hidden="true">
    <div id="nativeSidebarEdgeTrigger"></div>
  </div>
  <div data-template-mount="notification"></div>
  <div data-template-mount="dev-flow"></div>
</div>
<script type="module">
import "/@vite/client";
import "../desktop/renderer/styles/legacy/main.css";
import { resolveGalleryId, resolveSceneId } from "./scenarios/registry.ts";

function showEntryError(error) {
  document.body.replaceChildren();
  const message = document.createElement("main");
  message.setAttribute("role", "alert");
  message.textContent = error instanceof Error ? error.message : String(error);
  document.body.append(message);
}

async function mountGallery(id) {
  const response = await fetch(`gallery/${id}.html`);
  if (!response.ok) {
    throw new Error(`Unable to load prototype gallery: ${id} (${response.status})`);
  }
  const galleryDocument = new DOMParser().parseFromString(await response.text(), "text/html");
  const base = galleryDocument.createElement("base");
  base.href = new URL("gallery/", window.location.href).href;
  galleryDocument.head.prepend(base);
  galleryDocument.querySelector('script[src="visual-direction.js"]')?.remove();
  document.replaceChild(galleryDocument.documentElement, document.documentElement);
  await import(`./gallery/${id}.js`);
}

try {
  const params = new URLSearchParams(window.location.search);
  if (params.has("gallery")) {
    await mountGallery(resolveGalleryId(params.get("gallery")));
  } else {
    resolveSceneId(params.get("scene"));
    await import("./scripts/core/shell.ts");
  }
} catch (error) {
  showEntryError(error);
}
</script>
</body>
</html>
