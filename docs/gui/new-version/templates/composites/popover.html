<div class="thinking-level-popover" id="thinkingEffortPopover" data-od-id="thinking-effort-picker" role="dialog" aria-labelledby="thinkingEffortPickerTitle" hidden>
  <div class="thinking-level-popover-header">
    <span class="thinking-level-popover-title" id="thinkingEffortPickerTitle" data-od-id="thinking-effort-title" role="heading" aria-level="2">Thinking effort</span>
    <span class="thinking-level-popover-value" id="thinkingEffortPickerValue">Off</span>
  </div>
  <div class="thinking-level-slider-wrap">
    <input class="thinking-level-slider" id="thinkingEffortSlider" type="range" min="0" max="5" step="1" value="0" aria-label="Thinking effort" oninput="previewThinkingEffort(this.value)" onchange="selectThinkingEffort(this.value)">
    <div class="thinking-level-marks" id="thinkingEffortMarks" aria-hidden="true"></div>
  </div>
</div>
