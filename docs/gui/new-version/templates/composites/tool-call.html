<!-- Shared tool-call structure. Dynamic evidence is rendered into the declared slots. -->
<div class="tool-call" data-template-role="tool-call" data-tool-call-id="" tabindex="0">
  <div class="tool-track"><div class="tool-icon" data-slot="icon"></div></div>
  <div class="tool-content">
    <div class="tool-header">
      <span class="tool-call-status" data-slot="status"></span>
      <span class="tool-name" data-slot="name">Tool</span>
      <span class="tool-call-args" data-slot="args"></span>
      <span class="tool-call-toggle" data-slot="toggle"></span>
    </div>
  </div>
  <div class="tool-call-body" data-slot="body"></div>
</div>
