<div class="input-wrapper" data-od-id="composer" role="group" aria-label="Message composer">
        <div id="msgInput" class="rich-input" data-od-id="message-input" contenteditable="true" role="textbox" aria-label="Message Rózsa" aria-placeholder="Message Rózsa, supports Markdown…" aria-multiline="true" data-placeholder="Message Rózsa, supports Markdown…" oninput="handleInput(this, event)" oncompositionstart="handleCompositionStart(event)" oncompositionupdate="handleCompositionUpdate(this)" oncompositionend="handleCompositionEnd(this)"></div>
        <div class="input-toolbar" data-od-id="input-toolbar" role="toolbar" aria-label="Message actions">
          <button type="button" class="input-tool-btn" id="attachFileButton" title="Attach file" aria-label="Attach file" onclick="attachFileReference()"><svg class="lucide" data-lucide="paperclip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
          <button type="button" class="input-tool-btn" id="attachDirectoryButton" title="Attach folder" aria-label="Attach folder" onclick="attachDirectoryReference()" hidden><svg class="lucide" data-lucide="folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
          <button type="button" class="input-tool-btn" title="Slash commands" aria-label="Slash commands" onclick="insertSlashCommandPrefix()"><svg class="lucide" data-lucide="slash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l14 14"/></svg></button>
          <div class="context-ring" data-od-id="context-info" role="status" aria-label="Context usage">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><circle cx="9" cy="9" r="7" stroke="var(--border)" stroke-width="2" fill="none"/><circle cx="9" cy="9" r="7" stroke="var(--accent)" stroke-width="2" fill="none" stroke-dasharray="44" stroke-dashoffset="34.8" stroke-linecap="round" transform="rotate(-90 9 9)"/></svg>
            <span class="context-tokens" id="contextTokens">0k</span>
          </div>
          <div class="input-spacer"></div>
          <button type="button" class="model-selector" data-od-id="model-badge" title="Switch model" aria-label="Current model" id="modelSelector" onclick="showModelPicker()">(not configured)</button>
          <div class="thinking-level-control">
            <button class="thinking-level-badge" data-od-id="thinking-effort" id="thinkingEffort" type="button" title="Choose thinking effort" aria-label="Thinking effort" aria-haspopup="dialog" aria-expanded="false" onclick="toggleThinkingEffortPicker(event)">off</button>
          </div>
          <select class="model-selector" id="runningSendMode" title="Send mode while running" onchange="updateAbortButton()" hidden><option value="queue">Queue</option><option value="steer">Steer</option></select>
          <button type="button" class="send-btn" id="send-btn" data-od-id="send-btn" title="Send message" aria-label="Send message" onclick="sendMessage()"><svg class="lucide" data-lucide="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
        </div>
      </div>
