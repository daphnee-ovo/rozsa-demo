<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Rózsa · Sessions</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui); }
    main { max-width: 880px; margin: 0 auto; padding: 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    h1 { margin: 0; font: 500 28px/1.2 var(--font-display); }
    #refresh { border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); color: var(--fg); padding: 10px 16px; font: inherit; cursor: pointer; }
    #refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    #refresh:disabled { opacity: .55; cursor: default; }
    #status { color: var(--muted); margin: 24px 0 12px; overflow-wrap: anywhere; }
    #status[role="alert"] { color: var(--error); }
    #sessions { list-style: none; margin: 0; padding: 0; }
    #sessions .session-item { cursor: default; padding: 12px 16px; border-radius: 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    #sessions .session-name { white-space: normal; overflow-wrap: anywhere; color: var(--fg); }
    #sessions .session-meta { max-width: 50%; overflow-wrap: anywhere; }
    .session-select { display: flex; justify-content: space-between; gap: 16px; width: 100%; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; padding: 4px; }
    .session-select[aria-pressed="true"] { background: var(--surface); }
    .session-select:focus-visible, #retry-history:focus-visible { outline: 2px solid var(--accent); }
    .history-section { margin-top: 32px; border-top: 1px solid var(--border); padding-top: 24px; }
    #history-title { font: 500 22px/1.3 var(--font-display); overflow-wrap: anywhere; }
    #history-status { color: var(--muted); overflow-wrap: anywhere; }
    #history-status[role="alert"] { color: var(--error); }
    #retry-history { background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius-control); padding: 8px 16px; font: inherit; cursor: pointer; }
    #history { max-height: 50vh; overflow: auto; }
    .history-message { padding: 16px 0; border-bottom: 1px solid var(--border); }
    .history-message h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
    .history-message p { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
    .history-message summary { cursor: pointer; color: var(--muted); }
    @media (max-width: 680px) { main { padding: 24px; } #sessions .session-item { flex-direction: column; gap: 4px; } #sessions .session-meta { max-width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Sessions</h1><button id="refresh" type="button">Refresh</button></header>
    <p id="status" role="status" aria-live="polite">Loading sessions…</p>
    <ul id="sessions" aria-label="Sessions"></ul>
    <section class="history-section" aria-labelledby="history-title">
      <h2 id="history-title">Session history</h2>
      <p id="history-status" role="status" aria-live="polite">Select a session to view its history.</p>
      <button id="retry-history" type="button" hidden>Retry</button>
      <div id="history" role="region" aria-label="Read-only session history" tabindex="0"></div>
    </section>
  </main>
  <script type="module" src="./entry.ts"></script>
</body>
</html>
